name: CI

on:
  push:
    branches: [master]
  pull_request:

# Deny by default, then grant the minimum. Without this the workflow inherits
# the repository default, which is `write` — a read/write GITHUB_TOKEN handed to
# a job whose entire purpose is executing code from a pull request.
#
# `pull_request` (never `pull_request_target`) is the safe trigger: a fork's PR
# runs with no access to secrets and a read-only token regardless of this block.
# Switching to `pull_request_target` would run untrusted code *with* secrets and
# is the single worst change anyone could make to this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A fork PR can run arbitrary build and test scripts. It gets no secrets,
    # so the residual risk is runner abuse (crypto mining, a long-running
    # process); a timeout bounds it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here. These tools resolve paths out of
        # tsconfig/package.json and load the consumer's Prettier by absolute
        # path, and on Windows that needs a file:// URL — a failure that is
        # silent, degrading to an unformatted comparison that reports every
        # component as drifted.
        os: [ubuntu-latest, windows-latest]
        # Development requires Node 22+, because pnpm 11 imports `node:sqlite`,
        # which does not exist before 22.5 (`ERR_UNKNOWN_BUILTIN_MODULE`). That
        # is a constraint on contributors, not on consumers — see the
        # `engines-floor` job, which checks the range we actually publish.
        node: [22]

    steps:
      # Every third-party action is pinned to a commit SHA, not a tag. A tag is
      # mutable: whoever controls the action's repository can repoint `@v4` at
      # new code, which then runs inside our jobs. The version comment is for
      # humans; the SHA is what is executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave a credential in .git/config for PR-authored build
          # scripts to find and use.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # `--frozen-lockfile` refuses to resolve anything the committed lockfile
      # does not already pin, so a PR cannot quietly introduce a package.
      # Dependency lifecycle scripts do not run: pnpm 10+ blocks them unless
      # named in `pnpm.onlyBuiltDependencies`, and nothing is named.
      - run: pnpm install --frozen-lockfile

      - name: Lint (format, eslint, types)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  engines-floor:
    # Proves the `engines` floor we publish, which is a claim about *running*
    # the package, not developing it. A consumer on Node 20 types
    # `npx shadcn-drift`; they never invoke pnpm. So build with the toolchain's
    # Node, then execute the built CLI under the oldest supported Node.
    #
    # Running the matrix at node 20 instead tested the wrong thing and could
    # not even start: pnpm 11 needs `node:sqlite` (Node 22.5+).
    name: engines floor (node 20 runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run the built CLI on Node 20
        run: |
          node --version
          node packages/shadcn-drift/dist/cli.js --version
          node packages/shadcn-drift/dist/cli.js --help > /dev/null
          # `config` exercises discovery, JSONC parsing and alias resolution
          # without touching the network.
          node packages/shadcn-drift/dist/cli.js config \
            --cwd packages/shadcn-drift/test/fixtures/projects/subpath-imports-app
