name: Release

# Publishes whatever versions are already committed. Versioning happens
# locally (`pnpm version-packages`), not here.
#
# The usual changesets setup has CI open a "version packages" PR, which needs
# `contents: write`, `pull-requests: write`, and the repository setting that
# lets Actions create pull requests — all granted to the one workflow that
# publishes. Doing the version bump locally removes every one of those from the
# job's blast radius. What is left can read the repo, mint a short-lived OIDC
# credential, and publish. It cannot write to the repository, and it holds no
# long-lived secret of any kind.
on:
  push:
    branches: [master]

# Deny by default; the job grants itself the two things it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # There is no npm token to protect any more — authentication is OIDC (see
    # the publish step). The environment is kept for its *other* property: a
    # required human reviewer, restricted to `master`, so publishing is a
    # deliberate act rather than an automatic consequence of a merge.
    environment: npm-publish

    permissions:
      contents: read
      # Provenance only. npm mints the attestation from this OIDC token; it
      # grants no access to the repository.
      id-token: write

    steps:
      # Pinned to commit SHAs. A mutable tag on a third-party action is a
      # direct path to the publish credential: repoint `@v1`, and new code runs
      # in the job that can mint an OIDC token and push to the registry.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Published by `npm`, not `pnpm`, and with no token at all.
      #
      # Authentication is npm trusted publishing: the `id-token: write`
      # permission above lets npm mint an OIDC credential proving this workflow,
      # in this repository, produced the tarball. Provenance comes free with it —
      # no `--provenance` flag, no NPM_TOKEN, nothing long-lived to leak.
      #
      # Why not `changeset publish`, which knows how to publish only what
      # changed? Because changesets shells out to the detected package manager,
      # which here is pnpm, and pnpm documents `--provenance` but says nothing
      # about OIDC authentication. Those are different features: one attests a
      # build, the other replaces the token. Only npm documents the second, so
      # npm does this step. Revisit if pnpm documents OIDC support.
      #
      # The guard makes a re-run a no-op instead of a hard failure, which is what
      # `changeset publish` was providing.
      # Node 22 bundles npm 10.x; trusted publishing needs 11.5.1 or newer.
      # Without this the publish fails asking for authentication, which reads
      # like a misconfigured trusted publisher rather than an old client.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish
        run: |
          cd packages/shadcn-drift
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — nothing to do."
          else
            echo "Publishing $NAME@$VERSION"
            npm publish --access public
          fi
