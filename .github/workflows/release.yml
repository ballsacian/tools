name: Release

# Publishes whatever versions are already committed. Versioning happens
# locally (`pnpm version-packages`), not here.
#
# The usual changesets setup has CI open a "version packages" PR, which needs
# `contents: write`, `pull-requests: write`, and the repository setting that
# lets Actions create pull requests — all granted to the one workflow that also
# holds NPM_TOKEN. Doing the version bump locally removes every one of those
# from the job's blast radius. What is left can read the repo, mint an OIDC
# token, and publish. It cannot write to the repository at all.
on:
  push:
    branches: [master]

# Deny by default; the job grants itself the two things it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NPM_TOKEN lives in this environment, not in repository secrets, so it is
    # unreachable from any other workflow — including anything a merged pull
    # request might add. Configure the environment with required reviewers and
    # a branch restriction (master only) to make publishing a deliberate,
    # human-approved act rather than an automatic consequence of a merge.
    environment: npm-publish

    permissions:
      contents: read
      # Provenance only. npm mints the attestation from this OIDC token; it
      # grants no access to the repository.
      id-token: write

    steps:
      # Pinned to commit SHAs. A mutable tag on a third-party action is a
      # direct path to NPM_TOKEN: repoint `@v1`, and the new code runs in this
      # job with the secret in its environment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `--no-git-tag` because this job deliberately cannot write to the
      # repository. Tags are created and pushed by `pnpm version-packages`
      # locally, alongside the version commit.
      #
      # A no-op when nothing needs publishing: changesets compares each
      # package's version against the registry and exits cleanly if they match.
      - name: Publish
        run: pnpm exec changeset publish --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
